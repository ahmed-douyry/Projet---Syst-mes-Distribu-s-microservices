<div class="p-3">
  <div class="card-body">
    <input [(ngModel)]="query" type="text" class="form-control m-2" style="display: inline; width: 80%;" placeholder="Enter your prompt">
    <button (click)="askAgentStream()" class="btn btn-primary" style="display: inline; width: 18%;">
      <i class="bi bi-send me-2"></i>
      Send
    </button>
  </div>
  <div>
    @if (loadingService.isloading()) {
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    }
  </div>
  <div class="card-body">
    @if (response$ | async; as resp) {
      <div class="card m-2">
        <div class="card-body">
          @if (resp.type === "download" || resp.type === "response") {
            <markdown [data]="resp.content"></markdown>
          }

        </div>
      </div>

    }
</div>
