<div class="mobile-bar flex items-center justify-between">
  <a routerLink="/accounts" class="brand" aria-label="eBank — accueil"
    ><span class="brand-symbol"><i class="bi bi-bank2" aria-hidden="true"></i></span>eBank<span
      class="brand-period"
      >.</span
    ></a
  >
  <button
    #menuButton
    class="mobile-menu-button"
    type="button"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="primary-navigation"
    [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
  >
    <i class="bi" [class.bi-list]="!menuOpen()" [class.bi-x-lg]="menuOpen()" aria-hidden="true"></i>
  </button>
</div>
<aside class="sidebar" [class.menu-open]="menuOpen()" (keydown.escape)="closeMenu()">
  <a routerLink="/accounts" class="brand desktop-brand" aria-label="eBank — accueil"
    ><span class="brand-symbol"><i class="bi bi-bank2" aria-hidden="true"></i></span>eBank<span
      class="brand-period"
      >.</span
    ></a
  >
  <div class="workspace-switch">
    <span class="workspace-icon"><i class="bi bi-buildings" aria-hidden="true"></i></span>
    <div><strong>Espace de gestion</strong><span>Banque & comptes</span></div>
  </div>
  <nav id="primary-navigation" aria-label="Navigation principale">
    <p class="nav-label">VOTRE ESPACE</p>
    <a
      class="sidebar-link"
      routerLink="/accounts"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      (click)="menuOpen.set(false)"
      ><i class="bi bi-grid-1x2" aria-hidden="true"></i><span>Vue d’ensemble</span
      ><i class="bi bi-arrow-up-right nav-arrow" aria-hidden="true"></i
    ></a>
    <a
      class="sidebar-link"
      routerLink="/accounts"
      fragment="accounts-table"
      (click)="menuOpen.set(false)"
      ><i class="bi bi-wallet2" aria-hidden="true"></i><span>Tous les comptes</span></a
    >
    <a
      class="sidebar-link"
      routerLink="/accounts"
      fragment="distribution"
      (click)="menuOpen.set(false)"
      ><i class="bi bi-pie-chart" aria-hidden="true"></i><span>Répartition</span></a
    >
    <a
      class="sidebar-link"
      routerLink="/bot"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      (click)="menuOpen.set(false)"
      ><i class="bi bi-chat-dots" aria-hidden="true"></i><span>Assistant bancaire</span></a
    >
  </nav>
  <div class="sidebar-bottom">
    <div class="sidebar-note">
      <i class="bi bi-bank" aria-hidden="true"></i><strong>L’essentiel, en un regard.</strong>
      <p>Retrouvez vos soldes et vos comptes dans un seul espace.</p>
    </div>
    <button
      class="theme-button"
      type="button"
      (click)="theme.toggle()"
      [attr.aria-pressed]="theme.dark()"
    >
      <i
        class="bi"
        [class.bi-moon-stars]="!theme.dark()"
        [class.bi-sun]="theme.dark()"
        aria-hidden="true"
      ></i
      ><span>Mode sombre</span
      ><span class="theme-switch" [class.enabled]="theme.dark()"><span></span></span>
    </button>
    <div class="sidebar-signature">
      <span class="signature-icon">e.</span>
      <div><strong>eBank</strong><span>Gestion des comptes</span></div>
      <i class="bi bi-shield-check" aria-hidden="true"></i>
    </div>
  </div>
</aside>
