<div class="p-3">
  @if (accounts$ | async; as state){
    @if (state.errMessage) {
      <div class="alert alert-danger" role="alert">{{ state.errMessage }}</div>
    }
    <table class="table">
      <thead>
      <tr>
        <th>ID</th>
        <th>Balance</th>
        <th>created at </th>
        <th>type</th>
        <th>customer id </th>

      </tr>
      </thead>
      <tbody>
        @for (account of state.accounts; track account.id){
          <tr>
            <td>{{ account.id }}</td>
            <td>{{ account.balance }}</td>
            <td>{{ account.createdAt }}</td>
            <td>{{ account.type }}</td>
            <td>{{ account.customerID}}</td>
          </tr>
        }
      </tbody>

    </table>
  }
</div>
