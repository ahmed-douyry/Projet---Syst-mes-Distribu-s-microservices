spring.application.name=ebank-boot
# Also enable Message Content Intent in the Discord Developer Portal (Bot tab).
discord.gateway-intents=MESSAGE_CONTENT
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:gpt-oss:120b-cloud}
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
server.port=8082
spring.ai.mcp.client.streamable-http.connections.customer-service.url=http://localhost:8080/mcp
spring.ai.mcp.client.streamable-http.connections.bank-account-service.url=http://localhost:8081/mcp
discord.token=${DISCORD_TOKEN}
telegram.token=${TELEGRAM_TOKEN}
eureka.client.jersey.enabled=false
